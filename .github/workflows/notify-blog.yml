name: notify-blog

# Tells danielcho02/blog-src which writeups/notes changed so it can import them and redeploy.
# Runs on pushes to main and by hand, never on pull requests, so the token is not exposed to forks.
on:
  push:
    branches: [main]
    paths: ['**.md']
  workflow_dispatch:
    inputs:
      paths:
        description: 'Comma-separated paths to send instead of the last push diff'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Send changed markdown paths to blog-src
        env:
          GH_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT_PATHS: ${{ inputs.paths }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::BLOG_DISPATCH_TOKEN secret is not set"
            exit 1
          fi
          if [ -n "$INPUT_PATHS" ]; then
            paths="$INPUT_PATHS"
          else
            # A new branch (or a manual run) has no usable "before"; fall back to the previous commit.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE="$AFTER~1"; fi
            paths=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- '*.md' | paste -sd, -)
          fi
          if [ -z "$paths" ]; then
            echo "no added or modified markdown"
            exit 0
          fi
          echo "changed: $paths"
          if ! jq -n --arg paths "$paths" '{event_type: "pwnable-lab-push", client_payload: {paths: $paths}}' \
            | gh api repos/danielcho02/blog-src/dispatches --input -; then
            # Private repos answer 404 when the token cannot see them; tell the two cases apart.
            if gh api repos/danielcho02/blog-src --jq .full_name >/dev/null 2>&1; then
              echo "::error::token can read blog-src but cannot dispatch: set Contents to Read and write"
            else
              echo "::error::token cannot see blog-src: add blog-src to the token's repository access"
            fi
            exit 1
          fi
